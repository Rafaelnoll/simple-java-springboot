spring.application.name=currency-service
server.port=8100

spring.datasource.url=jdbc:postgresql://localhost/db_currency
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.locations=classpath:db_migration

eureka.client.service-url.default-zone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.client.healthcheck.enabled=true

management.endpoints.web.exposure.include=health, info, metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.health.defaults.enabled=true

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=3600s
spring.cloud.openfeign.circuitbreaker.enabled=true

# Timeout (via Resilience4j)
resilience4j.timelimiter.instances.BCBClient.timeoutDuration=5s

# Retry
resilience4j.retry.instances.BCBClient.maxAttempts=3
resilience4j.retry.instances.BCBClient.waitDuration=1s

# Circuit Breaker
resilience4j.circuitbreaker.instances.BCBClient.slidingWindowSize=5
resilience4j.circuitbreaker.instances.BCBClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.BCBClient.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.BCBClient.permittedNumberOfCallsInHalfOpenState=2